# ── LA CARTA ────────────────────────────────────────────────────────────
# Cómo está armada:  categorías (las pestañas) → grupos → productos.
#
# Cada producto tiene:
#   nombre:       obligatorio
#   descripcion:  corta, opcional
#   medida:       opcional, ej: 270 ml
#   precio:       el precio que se muestra. Solo el número, sin $ ni puntos: 9500
#                 Si queda vacío ("") dice "a completar".
#   pdf:          el precio que figura en el menú en PDF (solo como referencia)
#   foto:         opcional, ej: carta/latte.jpg
#   etiquetas:    opcional, ej: [De la casa] o [Sin TACC, Nuevo]
#   oculto:       si  → lo esconde sin borrarlo
#
# Para agregar un producto, copiá un bloque entero (desde el guion "-")
# y cambiale los datos. Para sacarlo, borralo o poné  oculto: si
