# ════════════════════════════════════════════════════════════════════════
#  CONTENIDO DE LA WEB DE ONCE Y SEIS
#  Todo lo que se ve en la página sale de este archivo.
#
#  Cómo editarlo sin romper nada:
#   • Cambiá solo lo que está DESPUÉS de los dos puntos ( : ).
#   • Respetá los espacios del principio de cada línea (la sangría).
#   • Si un texto lleva dos puntos ( : ) o empieza con ¿ o ¡, ponelo
#     entre comillas "así: como acá".
#   • Las líneas que empiezan con # son notas como esta: no se ven en la web.
#   • Para prender o apagar algo se escribe  si  o  no.
#   • Si algo queda mal escrito, la web NO se publica y sigue online la
#     versión anterior. Vercel muestra en qué línea está el error.
#
#  Fotos: se suben a la carpeta src/assets/fotos/ y acá se escribe la ruta
#  desde esa carpeta, por ejemplo  carta/croissant.jpg
#  Sirven JPG, PNG o WebP. La web las achica y las pasa a WebP sola.
#  Las fotos actuales son de muestra (Unsplash, uso libre): para cambiarlas
#  por las reales alcanza con subir una foto con el mismo nombre.
# ════════════════════════════════════════════════════════════════════════


