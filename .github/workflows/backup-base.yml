# Backup diario de la base de producción, cifrado.
#
# El plan Free de Supabase no hace backups. Esto saca uno por día con pg_dump,
# lo verifica, lo cifra con age (clave pública) y lo guarda 30 días como
# artefacto del workflow. El repo es público: el archivo SOLO se puede abrir
# con la clave privada, que nunca está en GitHub.
#
# Se activa solo cuando existe el secret SUPABASE_DB_URL (cadena de conexión
# del pooler en modo sesión; ver docs/DISASTER_RECOVERY.md). Mientras no esté,
# cada corrida termina avisando que falta, sin hacer nada.
#
# La clave pública de age va acá porque no es secreta: sirve para cifrar, no
# para abrir. Para cambiarla, crear el secret BACKUP_AGE_RECIPIENT (tiene
# prioridad) o editar AGE_PUBLICA.
name: Backup de la base

on:
  schedule:
    - cron: '30 6 * * *'     # 03:30 hora argentina
  workflow_dispatch:

permissions:
  contents: read

env:
  AGE_PUBLICA: age1uzh9vwcq0alrvsmzzgptsghec6elyqjzyg7mx2fcd7dru740rf4qjclqp3

concurrency:
  group: backup-base
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Ver si está configurado
        id: config
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "$DB_URL" ]; then echo "listo=si" >> "$GITHUB_OUTPUT"
          else echo "::warning::Backup apagado: falta el secret SUPABASE_DB_URL (ver docs/DISASTER_RECOVERY.md)"; fi

      - name: Instalar pg_dump 17 y age
        if: steps.config.outputs.listo == 'si'
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age

      # Los servidores de GitHub no tienen IPv6 y la conexión directa de
      # Supabase (db.<proyecto>.supabase.co) es solo IPv6. Si el secret trae esa
      # dirección, se arma la del pooler (IPv4) con el mismo usuario y
      # contraseña, y se usa la primera que conecte.
      - name: Elegir la conexión
        if: steps.config.outputs.listo == 'si'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REGION: sa-east-1
        run: |
          set -euo pipefail
          PG=/usr/lib/postgresql/17/bin
          candidatas=$(python3 - <<'PY'
          import os, re
          u = os.environ['DB_URL'].strip()
          m = re.match(r'^postgres(?:ql)?://([^:@/]+):(.*)@db\.([a-z0-9]+)\.supabase\.co(?::\d+)?/(\w+)', u)
          if not m:
              print(u)
          else:
              usuario, clave, ref, base = m.groups()
              for n in (0, 1):
                  print(f"postgresql://{usuario}.{ref}:{clave}@aws-{n}-{os.environ['REGION']}.pooler.supabase.com:5432/{base}")
          PY
          )
          while IFS= read -r c; do
            echo "::add-mask::$c"
            if $PG/psql "$c" -tAc 'select 1' >/dev/null 2>err.txt; then
              echo "CONEXION=$c" >> "$GITHUB_ENV"; rm -f err.txt; echo "Conexión lista"; exit 0
            fi
            echo "No conectó: $(sed -E 's#postgres(ql)?://[^ ]*#<oculto>#g' err.txt | head -1)"
          done <<< "$candidatas"
          rm -f err.txt
          echo "::error::No se pudo conectar a la base con SUPABASE_DB_URL"; exit 1

      - name: Volcar, verificar y cifrar
        if: steps.config.outputs.listo == 'si'
        env:
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT || env.AGE_PUBLICA }}
        run: |
          set -euo pipefail
          DB_URL="$CONEXION"
          PG=/usr/lib/postgresql/17/bin
          umask 077
          mkdir -p salida
          f="tratto-$(date -u +%Y%m%d-%H%M)"
          # 1) Esquema y datos propios de la app
          $PG/pg_dump "$DB_URL" -Fc --no-owner --no-privileges -n public -n privado -f "$f-app.dump"
          # 2) Cuentas de usuario (solo datos: el esquema auth lo crea Supabase)
          $PG/pg_dump "$DB_URL" -Fc --data-only -t auth.users -t auth.identities -f "$f-cuentas.dump"
          # Verificación: los archivos se pueden leer y tienen las tablas esperadas
          for x in "$f-app.dump" "$f-cuentas.dump"; do $PG/pg_restore --list "$x" > /dev/null; done
          $PG/pg_restore --list "$f-app.dump" | grep -q "TABLE DATA public solicitudes" \
            || { echo "::error::El backup no tiene la tabla solicitudes"; exit 1; }
          tar -cf "$f.tar" "$f-app.dump" "$f-cuentas.dump"
          age -r "$AGE_RECIPIENT" -o "salida/$f.tar.age" "$f.tar"
          rm -f "$f.tar" "$f-app.dump" "$f-cuentas.dump"
          echo "Backup cifrado: $(du -h salida/$f.tar.age | cut -f1)"

      - name: Guardar 30 días
        if: steps.config.outputs.listo == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: backup-base
          path: salida/*.age
          retention-days: 30
          if-no-files-found: error
