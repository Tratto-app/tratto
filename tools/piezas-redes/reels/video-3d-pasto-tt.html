<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="comun-3d.css">
<!-- Formato 3d (comun-3d.js). Tema: pasto alto → corte de pasto.
     Precio: precios_referencia id 38 (corte de pasto, terreno de hasta 100 m²,
     15.000 a 25.000, relevado abr-2026) con el ajuste de la calculadora
     (2 % por mes, 7 meses → 17.230 y 28.717, redondeados a 17.000 y 29.000). -->
</head><body>
<div id="escena"></div><div id="textos"></div>
<script>
window.RED = { url: 'trattoapp.com.ar/r/tt-pasto' };
window.ESCENA3D = (function () {
  let k, dueno, jardinero, maquina, cesped, pedacitos, card, chip, fin, url;
  // Tiempos, a partir de la voz (window.PALABRAS); valores de respaldo para las previas
  const P = {};
  function tiempos() {
    P.en = k.frase(2, 4.4);                    // la segunda frase: entra quien corta el pasto
    P.precio = k.palabra('diecisiete', 1, k.palabra('17', 1, 7.8));
    P.si = k.palabra('piden', 1, 11.2) - 0.3;  // "…te piden mucho más"
    P.pub = k.palabra('publicá', 1, 0) || (k.palabra('tratto', 1, 0) - 0.2) || 14.6; // "Publicá…" o "En Tratto lo pedís gratis…"
    P.fin = k.finVoz(19.0);
    P.cierre = P.fin + 0.35;
    P.m0 = P.en + 0.25;                         // entra el jardinero
    P.m1 = P.pub + 0.7;                         // termina de cortar
  }
  // Recorrido de la cortadora: entra por el portón y corta en franjas
  let tramo = [], largo = 0;
  function recorrido() {
    const pts = [[2.25, 6.2], [2.75, 3.5]];
    const zs = [3.5, 2.5, 1.5, 0.5, -0.5, -1.5, -2.5, -3.5];
    zs.forEach((z, i) => {
      const xa = i % 2 ? -2.75 : 2.75, xb = -xa;
      if (i) pts.push([xa, z]);
      pts.push([xb, z]);
    });
    tramo = []; largo = 0;
    for (let i = 1; i < pts.length; i++) {
      const [ax, az] = pts[i - 1], [bx, bz] = pts[i], l = Math.hypot(bx - ax, bz - az);
      tramo.push({ ax, az, bx, bz, l, desde: largo }); largo += l;
    }
  }
  function enRecorrido(t) {
    const u = k.clamp((t - P.m0) / (P.m1 - P.m0));
    // arranca y frena suave, el resto a velocidad pareja
    const d = largo * (u < 0.04 ? 0.5 * u * u / 0.04 / 0.98 : u > 0.96 ? 1 - 0.5 * (1 - u) * (1 - u) / 0.04 / 0.98 : (u - 0.02) / 0.96);
    for (const s of tramo) if (d <= s.desde + s.l || s === tramo[tramo.length - 1]) {
      const f = k.clamp((d - s.desde) / s.l);
      return { x: k.lerp(s.ax, s.bx, f), z: k.lerp(s.az, s.bz, f), d };
    }
  }
  function rumbo(t) { // hacia dónde mira, promediado para que doble sin saltos
    const a = enRecorrido(t - 0.12), b = enRecorrido(t + 0.12);
    if (Math.hypot(b.x - a.x, b.z - a.z) < 1e-4) return Math.atan2(-0.5, -2.7);
    return Math.atan2(b.x - a.x, b.z - a.z);
  }
  function marcarCortes() {
    const R = 0.5, paso = 1 / 60;
    for (let t = P.m0; t <= P.m1 + 0.01; t += paso) {
      const p = enRecorrido(t);
      for (const b of cesped.bri) if (b.tCorte === Infinity && Math.abs(b.x - p.x) < R && Math.abs(b.z - p.z) < R * 0.95) b.tCorte = t;
    }
  }
  function camara(t) {
    const cam = k.camara, T = k.THREE;
    let pos, mira;
    if (t < P.en) {                             // 1. el dueño con el pasto por las rodillas
      const x = k.suave(t / P.en), z = k.lerp(1, 0.84, x);
      mira = new T.Vector3(-0.4, 0.85, 0.6);
      pos = mira.clone().add(new T.Vector3(3.1 * z, 2.7 * z, 7.4 * z));
    } else if (t < P.si) {                       // 2. plano general: entra el jardinero
      const a = k.lerp(0.18, 0.02, k.suave((t - P.en) / (P.si - P.en)));
      mira = new T.Vector3(0, 0.3, -0.3);
      pos = new T.Vector3(Math.sin(a) * 15.5, 15.2, Math.cos(a) * 15.5).add(new T.Vector3(1.5, 0, 0));
    } else if (t < P.pub) {                      // 3. sigue a la cortadora de cerca
      const p = [0, 0.15, 0.3, 0.45, 0.6].map(d => enRecorrido(t - d)).reduce((s, q) => ({ x: s.x + q.x / 5, z: s.z + q.z / 5 }), { x: 0, z: 0 });
      mira = new T.Vector3(p.x * 0.7, 0.3, p.z * 0.8 + 0.4);
      pos = mira.clone().add(new T.Vector3(4.4, 7.2, 9.4));
    } else {                                     // 4. el patio listo
      const a = k.lerp(-0.05, -0.2, k.suave((t - P.pub) / 4));
      mira = new T.Vector3(-0.2, 0.4, -0.8);
      pos = new T.Vector3(Math.sin(a) * 13.2, 12.6, Math.cos(a) * 13.2);
    }
    cam.position.copy(pos); cam.lookAt(mira); cam.updateProjectionMatrix();
  }
  return {
    get duracion() { return P.cierre + 2.8; },
    get cierre() { return P.cierre; },
    // efectos (sonido.py): cortes de cámara, el precio, el chip y el logo
    get efectos() {
      return [
        { efecto: 'latigazo', t: +(P.en - 0.2).toFixed(2), db: -18 },
        { efecto: 'pop', t: +(P.precio - 0.15).toFixed(2), db: -16 },
        { efecto: 'campanita', t: +(P.precio + 0.05).toFixed(2), db: -18 },
        { efecto: 'sello', t: +(P.precio + 0.3).toFixed(2), db: -18 },
        { efecto: 'latigazo', t: +(P.si - 0.2).toFixed(2), db: -19 },
        { efecto: 'latigazo', t: +(P.pub - 0.2).toFixed(2), db: -19 },
        { efecto: 'pop', t: +(P.pub + 0.25).toFixed(2), db: -16 },
        { efecto: 'golpe', t: +(P.cierre + 0.1).toFixed(2), db: -14 },
      ];
    },
    armar(kit) {
      k = kit; tiempos(); recorrido();
      const zona = k.patio({ ancho: 6.4, fondo: 8 });
      cesped = k.pasto({ zona: { x0: zona.x0, x1: zona.x1, z0: zona.z0, z1: zona.z1 }, cantidad: 2600 });
      dueno = k.personaje({ ropa: '#6D9BC3', pantalon: '#2E3F66' });
      jardinero = k.personaje({ ropa: k.C.verdeVivo, pantalon: '#3B3F45', gorra: k.C.laton, piel: '#C9956E', pelo: '#1C1410' });
      maquina = k.cortadora(k.C.laton);
      pedacitos = k.recortes(320);
      marcarCortes();
      url = k.etiquetaUrl();
      card = k.tarjeta(`<div class="sello">Precio<br>de<br>referencia</div>
        <div class="t-et">CORTE DE PASTO · HASTA 100 m²</div>
        <div class="t-precio">$17.000<span>a</span>$29.000</div>
        <div class="t-nota">Noviembre 2026 · AMBA · por trabajo</div>`);
      chip = k.tarjeta(`<div class="ok">✓</div><div><div class="c1">Pedido publicado gratis</div><div class="c2">Corte de pasto · tu zona</div></div>`, 'chip3d');
      fin = k.cierre('Pedí presupuestos', 'de gente de tu zona');
    },
    animar(t) {
      // dueño: en el pasto rascándose la cabeza; después va a la galería y mira
      const ida = k.clamp((t - (P.en + 0.15)) / 1.7);
      const a = { x: -0.4, z: 0.6 }, b = { x: -1.3, z: -4.55 };
      dueno.position.set(k.lerp(a.x, b.x, k.suave(ida)), 0, k.lerp(a.z, b.z, k.suave(ida)));
      const caminando = ida > 0 && ida < 1;
      if (t < P.en + 0.15) {
        dueno.rotation.y = 0.35 + Math.sin(t * 1.3) * 0.12;
        k.pose(dueno, { rascar: t > 0.5 && t < P.en - 0.6 ? t : 0, cabezaX: -0.08, cabezaY: Math.sin(t * 1.1) * 0.2 });
      } else if (caminando) {
        dueno.rotation.y = Math.atan2(b.x - a.x, b.z - a.z);
        k.pose(dueno, { caminar: 1, paso: t * 1.9 });
      } else {
        const vuelta = k.suave((t - (P.en + 1.85)) / 0.4);
        dueno.rotation.y = k.lerp(Math.atan2(b.x - a.x, b.z - a.z) + Math.PI * 2, 0.35, vuelta);
        const festeja = t > P.pub + 0.8 && t < P.cierre;
        k.pose(dueno, festeja ? { festejo: t, salto: Math.abs(Math.sin((t - P.pub) * 7)) * 0.18 } : { brazosCruzados: true });
      }
      // cortadora y jardinero
      maquina.visible = jardinero.visible = t >= P.en;
      const p = enRecorrido(t), r = rumbo(t), andando = t > P.m0 && t < P.m1;
      maquina.position.set(p.x, andando ? Math.abs(Math.sin(t * 38)) * 0.015 : 0, p.z); maquina.rotation.y = r;
      jardinero.position.set(p.x - Math.sin(r) * 1.12, 0, p.z - Math.cos(r) * 1.12); jardinero.rotation.y = r;
      if (t < P.m1 + 0.4) k.pose(jardinero, { caminar: andando ? 1 : 0, paso: p.d / 1.3, empujar: true });
      else {
        jardinero.rotation.y = k.lerp(r, 0.5, k.suave((t - P.m1 - 0.4) / 0.4));
        k.pose(jardinero, { saludo: t > P.m1 + 0.8 ? t : 0 });
      }
      cesped.animar(t, t < P.en ? 1.2 : 0.7);
      pedacitos.animar(t, P.m0 + 0.5, P.m1 - 0.1, enRecorrido);
      camara(t);
      // textos
      k.mostrar(card, t, P.precio - 0.15, P.pub - 0.05);
      k.mostrar(chip, t, P.pub + 0.25, P.cierre + 0.2);
      url.style.opacity = t < P.cierre ? 1 : 0;
      fin.animar(t, P.cierre);
    },
  };
})();
</script>
<script src="lib/three-0.170.0.min.js"></script>
<script src="comun-3d.js"></script>
</body></html>
