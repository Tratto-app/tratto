# ── CÓMO TRABAJAMOS ─────────────────────────────────────────────────────
proceso:
  etiqueta: Cómo trabajamos
  titulo: Del archivo *al papel*
  pasos:
    - titulo: Enviás tus archivos
      texto: Por WhatsApp como documento, por mail o con un link de Drive. Nos contás qué querés imprimir y en qué tamaño.
    - titulo: Revisamos y te asesoramos
      texto: Miramos la resolución, el color y el encuadre de cada foto. Si algo no va a salir bien, te avisamos antes.
    - titulo: Imprimimos con control de calidad
      texto: Ajustamos cada archivo para papel y controlamos cada copia antes de entregarla.
    - titulo: Retirás o te lo enviamos
      texto: Pasás a buscar tu pedido o coordinamos el envío a tu casa.


# ── CÓMO ENVIAR TUS FOTOS ───────────────────────────────────────────────
como_enviar:
  etiqueta: Cómo enviar tus fotos
  titulo: Mandalas *enteras*
  bajada: Si la foto llega comprimida, se pierde calidad que después no se recupera. Con estos pasos llega tal cual la sacaste.
  consejos:
    - titulo: Formato
      texto: JPG en la máxima calidad, PNG o TIFF. Si sacás en RAW, consultanos.
    - titulo: Resolución
      texto: Lo ideal son 300 DPI al tamaño de impresión. Una foto de celular actual alcanza para copias de hasta 20x30.
    - titulo: El original
      texto: Mandá la foto como salió de la cámara o del celular, no una captura de pantalla ni una bajada de redes.
  metodos:
    - titulo: WhatsApp como documento
      pasos:
        - "En Android: tocá el clip, elegí Documento y buscá la foto."
        - "En iPhone: tocá el +, elegí Documento y después Elegir fotos."
        - "La opción HD ayuda, pero igual comprime: mejor como documento."
    - titulo: Por mail
      pasos:
        - Adjuntá las fotos sin achicarlas (si el celular pregunta el tamaño, elegí Real o Grande).
        - Si son muchas, mejor usá un link de Drive.
    - titulo: Drive o WeTransfer
      pasos:
        - Subí las fotos a una carpeta y compartinos el link.
        - Ideal para pedidos grandes, álbumes y fotolibros.


# ── PREGUNTAS FRECUENTES ────────────────────────────────────────────────
# ⚠ Revisar con Vane: tiempos, envíos y formas de pago son generales.
preguntas_titulo: Preguntas frecuentes
preguntas:
  - pregunta: ¿Cuánto tardan en estar las fotos?
    respuesta: Depende del trabajo y de la cantidad. Las copias suelen estar en pocos días; cuadros, fotolibros y restauraciones llevan más tiempo. Cuando nos pasás el pedido te confirmamos la fecha de entrega.
  - pregunta: ¿Qué formatos de archivo aceptan?
    respuesta: JPG, PNG, TIFF y PDF. Si trabajás en RAW o con otro formato, consultanos y lo vemos.
  - pregunta: ¿Puedo imprimir fotos sacadas con el celular?
    respuesta: Sí. Los celulares actuales sacan fotos con muy buena resolución. Lo importante es mandarlas como documento para que no se compriman. Con la calculadora de esta página podés ver hasta qué tamaño rinde tu foto.
  - pregunta: ¿Hacen envíos?
    respuesta: Sí. Podés retirar tu pedido o coordinamos el envío. El costo depende de la zona; te lo pasamos junto con el presupuesto.
  - pregunta: ¿Cómo se paga?
    respuesta: Te pasamos las formas de pago junto con el presupuesto por WhatsApp.
  - pregunta: Mi foto es vieja o está dañada, ¿se puede recuperar?
    respuesta: En muchos casos sí. Escaneamos la foto, la restauramos (manchas, roturas, color) y te entregamos el archivo digital y, si querés, una copia nueva impresa.
  - pregunta: ¿Por qué la foto impresa se ve distinta que en el celular?
    respuesta: Porque la pantalla tiene luz propia y el papel no. Por eso revisamos y ajustamos cada archivo antes de imprimir. Lo explicamos mejor en la sección Pantalla vs papel.


