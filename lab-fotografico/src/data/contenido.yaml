# ── PANTALLA VS PAPEL ───────────────────────────────────────────────────
pantalla_vs_papel:
  etiqueta: Pantalla vs papel
  titulo: Lo que ves en pantalla no siempre es lo que sale *en papel*   # Lo que va entre *asteriscos* sale en cursiva y color
  bajada: Antes de llegar al papel, una foto pasa por la cámara o el celular, por las apps y por la forma en que nos la mandás. Cada paso puede cambiar el resultado.

  # El comparador que se desliza. Las dos fotos tienen que tener la misma medida.
  comparador:
    - pestana: WhatsApp comprime
      izquierda: Como llegó por WhatsApp
      derecha: El archivo original
      foto_izquierda: pantalla-vs-papel/foto-comprimida-whatsapp.jpg
      foto_derecha: pantalla-vs-papel/foto-base.jpg
      efecto_pantalla: false
      nota: WhatsApp achica la foto y le saca información. En el celular casi no se nota; impresa, el cielo se llena de escalones y manchas.
    - pestana: La pantalla brilla
      izquierda: En la pantalla
      derecha: En papel
      foto_izquierda: pantalla-vs-papel/foto-base.jpg
      foto_derecha: pantalla-vs-papel/foto-base.jpg
      efecto_pantalla: true      # Simula el brillo y el color de un celular
      nota: La pantalla tiene luz propia y muestra los colores más intensos. En papel la foto se ve con la luz del lugar, por eso la ajustamos antes de imprimir.
  foto_descripcion: Ciudad al atardecer con un globo aerostático

  # Íconos disponibles: pixeles, compresion, pantalla, apps
  bloques:
    - icono: pixeles
      titulo: Píxeles y resolución
      texto: Cada foto tiene una cantidad fija de píxeles. Para una copia nítida se necesitan unos 300 por cada pulgada de papel (eso es el DPI). Si la foto es chica y la imprimís grande, sale borrosa.
      dato: "Una 10x15 nítida: 1181 × 1772 px"
    - icono: compresion
      titulo: WhatsApp e Instagram comprimen
      texto: Al enviarla o subirla, achican la foto para que pese menos y se pierde detalle. Mandala como documento, por mail o por Drive y llega entera.
      dato: Enviala como documento
    - icono: pantalla
      titulo: La pantalla no es papel
      texto: El celular tiene brillo propio y colores más saturados. En papel la foto depende de la luz del ambiente, así que una imagen oscura en pantalla sale todavía más oscura.
      dato: Brillo de pantalla ≠ papel
    - icono: apps
      titulo: Apps, filtros y capturas
      texto: Cada filtro, edición o captura de pantalla le saca calidad a la foto. Siempre conviene el archivo original de la cámara o del celular.
      dato: Mejor el archivo original

  cierre_titulo: Detrás de cada foto hay *revisión, ajuste y control.*
  cierre_texto: Revisamos cada archivo y te asesoramos para lograr el mejor resultado posible.
  cierre_boton: Mandanos tu foto y la revisamos


