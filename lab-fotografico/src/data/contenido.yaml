    respuesta: Solo en JPG, en la máxima calidad. Mandalas como documento por WhatsApp o por mail a fotodigital9901@gmail.com para que no se compriman.
  - pregunta: ¿Qué tamaños imprimen?
    respuesta: Copias desde 9×13 hasta 60×90 cm. Las medidas estándar son 9×13, 10×15, 13×18, 15×21 y 20×30; también hacemos 30×40, 30×45 y panorámicas de 30×60 y 30×90.
  - pregunta: ¿Cuánto tardan en estar las fotos?
    respuesta: Depende del trabajo y de la cantidad. Cuando nos pasás el pedido te confirmamos la fecha de entrega.
  - pregunta: ¿Puedo imprimir fotos sacadas con el celular?
    respuesta: Sí. Los celulares actuales sacan fotos con muy buena resolución. Lo importante es mandarlas como documento para que no se compriman. Con la calculadora de esta página podés ver hasta qué tamaño rinde tu foto.
  - pregunta: ¿Hacen envíos?
    respuesta: Podés retirar tu pedido en el local o coordinamos el envío. Consultanos por WhatsApp.
  - pregunta: ¿Cómo se paga?
    respuesta: Te pasamos las formas de pago junto con el presupuesto por WhatsApp.
  - pregunta: Mi foto es vieja o está dañada, ¿se puede recuperar?
    respuesta: En muchos casos sí. Restauramos fotografías antiguas o deterioradas, mejorando colores, contraste y detalles, y te entregamos el archivo digital y, si querés, una copia nueva impresa.
  - pregunta: ¿Por qué la foto impresa se ve distinta que en el celular?
    respuesta: Porque la pantalla tiene luz propia y el papel no. Por eso revisamos y ajustamos cada archivo antes de imprimir. Lo explicamos mejor en la sección Pantalla vs papel.


