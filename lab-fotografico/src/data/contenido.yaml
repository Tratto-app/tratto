#  CONTENIDO DEL SITIO
#  Todo lo que se ve en la página sale de este archivo.
#
#  Cómo editarlo sin romper nada:
#   • Cambiá solo lo que está DESPUÉS de los dos puntos ( : ).
#   • Respetá los espacios del principio de cada línea (la sangría).
#   • Si un texto lleva dos puntos ( : ), ponelo entre comillas "así: como acá".
#   • Las líneas que empiezan con # son notas como esta: no se ven en el sitio.
#   • Si algo queda mal escrito, el sitio NO se publica y sigue online la
#     versión anterior. Vercel muestra en qué línea está el error.
#
#  Fotos: se suben a la carpeta src/assets/fotos/ y acá se escribe la ruta
#  desde esa carpeta, por ejemplo  servicios/fine-art.jpg
#  Sirven JPG, PNG o WebP. El sitio las achica y las pasa a WebP solo.
# ════════════════════════════════════════════════════════════════════════


