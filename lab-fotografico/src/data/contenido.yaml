# ── CÓMO TRABAJAMOS ─────────────────────────────────────────────────────
proceso:
  etiqueta: Cómo trabajamos
  titulo: Del archivo *al papel*
  pasos:
    - titulo: Enviás tus archivos
      texto: En JPG, por WhatsApp como documento o por mail. Nos contás qué querés imprimir y en qué tamaño.
    - titulo: Revisamos y te asesoramos
      texto: Miramos la resolución, el color y el encuadre de cada foto. Si algo no va a salir bien, te avisamos antes.
    - titulo: Imprimimos con control de calidad
      texto: Ajustamos cada archivo para papel y controlamos cada copia antes de entregarla.
    - titulo: Retirás o te lo enviamos
      texto: Pasás a buscar tu pedido por Diagonal 79 Nº 1002 o coordinamos el envío.


# ── CÓMO ENVIAR TUS FOTOS ───────────────────────────────────────────────
como_enviar:
  etiqueta: Cómo enviar tus fotos
  titulo: Mandalas *enteras*
  bajada: Si la foto llega comprimida, se pierde calidad que después no se recupera. Con estos pasos llega tal cual la sacaste.
  consejos:
    - titulo: Solo JPG
      texto: Recibimos los archivos únicamente en formato JPG, en la máxima calidad y listos para imprimir.
    - titulo: Resolución
      texto: Lo ideal son 300 DPI al tamaño de impresión. Una foto de celular actual alcanza para copias de hasta 20×30.
    - titulo: El original
      texto: Mandá la foto como salió de la cámara o del celular, no una captura de pantalla ni una bajada de redes.
  metodos:
    - titulo: WhatsApp como documento
      pasos:
        - "En Android: tocá el clip, elegí Documento y buscá la foto."
        - "En iPhone: tocá el +, elegí Documento y después Elegir fotos."
        - "La opción HD ayuda, pero igual comprime: mejor como documento."
    - titulo: Por mail
      pasos:
        - "Mandalas a fotodigital9901@gmail.com"
        - Adjuntalas sin achicarlas (si el celular pregunta el tamaño, elegí Real o Grande).
        - Si son muchas, compartinos un link de Drive o WeTransfer.

  # Ejemplo de cómo ordenar un pedido grande en carpetas
  carpetas_titulo: Organizá tu pedido en carpetas
  carpetas_bajada: Así procesamos tu pedido más rápido y sin errores.
  carpetas:
    - medida: 15×21 sin borde
      subcarpetas: [2 copias, 3 copias, 4 copias, 5 copias]
    - medida: 15×21 con borde
      subcarpetas: [2 copias, 3 copias, 4 copias, 5 copias]
  carpetas_importante:
    - Enviá las carpetas con las medidas correctas.
    - Indicá claramente si es con borde o sin borde.
    - Separá por cantidad de copias.
    - Enviá los archivos en JPG, listos para imprimir.


