# Compila la app de iPhone en la nube (Codemagic tiene Macs) y la sube a
# TestFlight. La app vive en tools/ios-app. Se corre a mano desde codemagic.io.
# También arma el paquete de Android para Play (workflow android-play, abajo).
# Requisitos (una sola vez), ver tools/ios-app/README.md:
#   - integración "Tratto App Store Connect" (clave API de App Store Connect)
#   - APP_STORE_APPLE_ID: el número de la app en App Store Connect
#   - grupo de variables "ios_firma" con CERTIFICATE_PRIVATE_KEY (secreta)
workflows:
  ios-testflight:
    name: Tratto iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: tools/ios-app
    integrations:
      app_store_connect: Tratto App Store Connect
    environment:
      groups:
        - ios_firma   # CERTIFICATE_PRIVATE_KEY (secreta): clave RSA con la que se crea el certificado de distribución
      vars:
        APP_STORE_APPLE_ID: 6819329487   # Apple ID numérico de la app en App Store Connect
        BUNDLE_ID: ar.com.trattoapp
      xcode: latest
      node: 22
    scripts:
      - name: Instalar dependencias
        script: npm ci
      - name: Sincronizar Capacitor
        script: npx cap sync ios
      - name: Preparar firma (crea certificado y perfil la primera vez)
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Número de build
        script: |
          ULTIMO=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          cd ios/App && agvtool new-version -all $((ULTIMO + 1))
      - name: Compilar
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Solo sube la build: queda en TestFlight para quienes prueban desde la
        # cuenta y lista para elegirla en la versión de la App Store. Mandarla
        # a la revisión de TestFlight externo pide datos de prueba que no
        # usamos y deja la build en rojo aunque la subida haya andado.
        submit_to_testflight: false

  # Sube la ficha de la App Store (textos, capturas, categorías, clasificación
  # por edad, datos para el revisor y la build) desde tools/tiendas. No compila
  # nada y tarda un par de minutos. Ver tools/tiendas/subir-ficha-ios.mjs.
  ios-ficha:
    name: Tratto iOS → ficha de la App Store
    max_build_duration: 15
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Tratto App Store Connect
    environment:
      node: 22
    scripts:
      - name: Subir la ficha
        script: node tools/tiendas/subir-ficha-ios.mjs

  # Arma el paquete de Android (tools/android-twa) firmado con la clave de
  # subida, listo para cargar a mano en Play Console. La versión sale de
  # tools/android-twa/twa-manifest.json (appVersionName y appVersionCode).
  # Requisito (una sola vez): la clave de subida en Team settings → Code
  # signing identities → Android keystores, con el nombre "tratto_upload".
  # La clave nunca pasa por el repo.
  android-play:
    name: Tratto Android → paquete para Play
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - tratto_upload   # CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
      java: 17
      node: 22
      vars:
        TWA_DIR: /tmp/twa
    scripts:
      - name: Generar el proyecto
        script: |
          cd tools/android-twa
          npm i --no-save @bubblewrap/core@1.25.0
          node generar.js
      - name: Compilar
        script: |
          cd "$TWA_DIR"
          chmod +x gradlew
          ./gradlew bundleRelease
      - name: Firmar
        script: |
          set -e
          VERSION=$(node -p "require('./tools/android-twa/twa-manifest.json').appVersionName")
          mkdir -p salida-android
          cp "$TWA_DIR/app/build/outputs/bundle/release/app-release.aab" "salida-android/tratto-$VERSION.aab"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" -keypass "$CM_KEY_PASSWORD" \
            "salida-android/tratto-$VERSION.aab" "$CM_KEY_ALIAS"
          jarsigner -verify "salida-android/tratto-$VERSION.aab"
    artifacts:
      - salida-android/*.aab
